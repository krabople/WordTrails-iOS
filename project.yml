name: WordTrails
options:
  bundleIdPrefix: com.krabople
  deploymentTarget:
    iOS: '17.0'
packages:
  TrailCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 6YYA8L76Y8
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  WordTrails:
    type: application
    platform: iOS
    sources:
      - App
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.wordtrails
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Support/WordTrails.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Word Trails
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(WORDTRAILS_CERTIFICATE_SHA1)
          PROVISIONING_PROFILE_SPECIFIER: $(WORDTRAILS_PROFILE_UUID)
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Word Trails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSGKFriendListUsageDescription: Word Trails shows your Game Center friends so you can invite them to a trail.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Support/WordTrails.entitlements
      properties:
        com.apple.developer.game-center: true
  WordTrailsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WordTrails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krabople.wordtrails.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WordTrails:
    build:
      targets:
        WordTrails: all
    test:
      targets: [WordTrailsUITests]
